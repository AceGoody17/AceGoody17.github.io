<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Picker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Rajdhani&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>

    <div class="box" style="text-align: center;">
      <h2 style="font-family: 'VT323', sans-serif; font-size: 5rem;">Movie of the Day</h2>
      <a id="name_display" target="_blank" style="pointer-events: none; text-decoration: none;">Pick a movie!</a>
      <button class="interactive_button" onclick="showName()">
        Choose Today's Movie
      </button>
    </div>

    <script>
      const movies = [
        { title: "Shawshank Redemption", imdb: "https://www.imdb.com/title/tt0111161/" },
        { title: "Forrest Gump", imdb: "https://www.hotstar.com/in/movies/forrest-gump/1271416362" },
        { title: "Seven", imdb: "https://www.imdb.com/title/tt0114369/" },
        { title: "Enola Holmes", imdb: "https://www.netflix.com/title/81277950" },
        { title: "Kill Bill: Vol. 1", imdb: "https://www.netflix.com/title/60031236" },
        { title: "Kill Bill: Vol. 2", imdb: "https://www.netflix.com/title/60032563" },
        { title: "Spirited Away", imdb: "https://www.imdb.com/title/tt0245429/" },
        { title: "Lord of the Rings: Fellowship of the Ring", imdb: "https://www.netflix.com/title/60004480" },
        { title: "Lord of the Rings: Fellowship of the Ring", imdb: "https://www.netflix.com/title/60004483" },
        { title: "Lord of the Rings: Fellowship of the Ring", imdb: "https://www.netflix.com/title/60004484" },
        { title: "How to Lose a Guy in 10 Days", imdb: "https://www.imdb.com/title/tt0335559/" },
        { title: "Band Baaja Baaraat", imdb: "https://www.netflix.com/title/70170857" },
        { title: "Bachna Ae Haseeno", imdb: "https://www.netflix.com/title/70104309" },
        { title: "Dilwale Dulhaniya Le Jayenge", imdb: "https://www.netflix.com/title/60036747" },
        { title: "Jab Tak He Jaan", imdb: "https://www.netflix.com/title/70258134" },
        { title: "Guru", imdb: "https://www.netflix.com/title/70063017" },
        { title: "Knives Out", imdb: "https://www.netflix.com/title/81037684" },
        { title: "Spider-Man: Into the Spider-Verse", imdb: "https://www.primevideo.com/region/eu/detail/0NHHISV1B1JPKDREXLY8FTJF93" },
        { title: "Wall-E", imdb: "https://www.hotstar.com/in/movies/walle/1660010169" },
        { title: "Bridget Jones's Diary", imdb: "https://www.primevideo.com/detail/0U01XGUVE9MDT6BIUVQNTDTYOB" },
        { title: "Coco", imdb: "https://www.hotstar.com/in/movies/coco/1660010633?search_query=coco" },
        { title: "Eternal Sunshine of the Spotless Mind", imdb: "https://www.imdb.com/title/tt0338013/" },
        { title: "The Departed", imdb: "https://www.primevideo.com/detail/0NFUQ5A9TFWZJ3VFTFOJ4R89RU" },
        { title: "Up", imdb: "https://www.hotstar.com/in/movies/up/1660010198" },
        { title: "Rocket Singh: Salesman of the Year", imdb: "https://www.netflix.com/title/70129117" },
        { title: "Kahaani", imdb: "https://www.primevideo.com/dp/amzn1.dv.gti.02f9eb9c-0e2b-4f70-978f-1617ce5ba95e?autoplay=0&ref_=atv_cf_strg_wb" },
        { title: "The Truman Show", imdb: "https://www.netflix.com/title/11819086" },
        { title: "Fight Club", imdb: "https://www.netflix.com/title/26004747" },
        { title: "Anora", imdb: "https://www.netflix.com/title/81952362" },
        { title: "Marriage Story", imdb: "https://www.netflix.com/title/80223779" },
        { title: "Lady Bird", imdb: "https://www.netflix.com/title/80205227" },
        { title: "The Girl with a Dragon Tattoo", imdb: "https://www.primevideo.com/dp/amzn1.dv.gti.c6a9f792-1ba0-5818-6e89-54f8350da6fb?autoplay=0&ref_=atv_cf_strg_wb" },
        { title: "Youth", imdb: "https://www.netflix.com/title/82723855" },
      ];

      const VERSION = "v2";
      if (localStorage.getItem("version") !== VERSION) {
        localStorage.removeItem("remaining");
        localStorage.setItem("version", VERSION);
      }

      let remaining = JSON.parse(localStorage.getItem("remaining")) || [...movies];

      function showName() {
        const now = new Date();
        const istOffset = 5.5 * 60 * 60 * 1000;
        const istTime = new Date(now.getTime() + istOffset);
        const todayIST = istTime.toISOString().split("T")[0];

        const lastPicked = localStorage.getItem("lastPickedDate");

        if (lastPicked === todayIST) {
          alert("You've already picked today's movie! Come back after 12AM IST.");
          return;
        }

        const display = document.getElementById("name_display");

        display.style.pointerEvents = "none";
        display.style.textDecoration = "none";

        let shuffleCount = 0;
        const totalShuffles = 20;
        const startSpeed = 50;
        const endSpeed = 300;

        if (remaining.length === 0) {
          display.textContent = "No more movies!";
          return;
        }

        function shuffle() {
          if (shuffleCount < totalShuffles) {
            const random = remaining[Math.floor(Math.random() * remaining.length)];
            display.textContent = random.title;
            display.style.opacity = 1;
            display.style.transform = "translateY(0)";
            shuffleCount++;
            const progress = shuffleCount / totalShuffles;
            const speed = startSpeed + (endSpeed - startSpeed) * progress;
            setTimeout(shuffle, speed);
          } else {
            const number = Math.floor(Math.random() * remaining.length);
            const final_movie = remaining[number];
            display.textContent = final_movie.title;
            display.href = final_movie.imdb;
            display.style.pointerEvents = "auto";
            display.style.textDecoration = "underline";
            remaining.splice(number, 1);
            localStorage.setItem("remaining", JSON.stringify(remaining));
            localStorage.setItem("lastPickedDate", todayIST);
            confetti({
              particleCount: 100,
              spread: 70,
              origin: { y: 0.6 },
              colors: ['#FFFF00', '#ffffff', '#FFD700']
            });
          }
        }

        shuffle();
      }
    </script>

  </body>
</html>
